serde = { workspace = true, features = ["derive"] }
quick-xml = { workspace = true, features = ["serialize"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nalgebra = { workspace = true }
walkdir = { workspace = true }
